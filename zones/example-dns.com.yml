# zones/example-dns.com.yml
# DNS zone definition for example-dns.com
# Managed via DNS-as-Code — see https://github.com/example-dns/example-dns

zone: example-dns.com
ttl_default: 3600

records:
  - name: "@"
    type: SOA
    content: "ns1.example-dns.net. hostmaster.example-dns.com. 2024010101 10800 3600 604800 3600"

  - name: "@"
    type: NS
    content: "ns1.example-dns.net."

  - name: "@"
    type: NS
    content: "ns2.example-dns.org."

  - name: "@"
    type: A
    ttl: 300
    content: "203.0.113.1"

  - name: "www"
    type: CNAME
    content: "example-dns.com."

  - name: "@"
    type: MX
    priority: 10
    content: "mail.example-dns.com."

  - name: "mail"
    type: A
    content: "203.0.113.2"

  - name: "@"
    type: TXT
    content: '"v=spf1 mx ~all"'

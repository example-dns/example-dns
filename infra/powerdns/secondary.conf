# PowerDNS Authoritative Server Configuration - Secondary Nameserver (example-dns.org)

# Network and General
launch=gsqlite3
local-address=0.0.0.0
local-port=53
distributor-threads=2
receiver-threads=2

# Secondary / Slave Mode
master=no
slave=yes
slave-cycle-interval=60

# Supermaster / Automatic zone provisioning from primary
autosecondary=yes

# Backend configuration (SQLite3)
gsqlite3-database=/var/lib/powerdns/pdns-secondary.sqlite3
gsqlite3-pragma-synchronous=1
gsqlite3-pragma-foreign-keys=1

# Logging
loglevel=4
log-dns-queries=no
log-timestamp=yes

# DNSSEC
dnssec=yes

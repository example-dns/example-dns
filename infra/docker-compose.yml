services:
  init-db:
    image: alpine:latest
    container_name: example-dns-init-db
    restart: "no"
    volumes:
      - ./powerdns/schema.sql:/etc/powerdns/schema.sql:ro
      - primary-data:/data/primary
      - secondary-data:/data/secondary
    entrypoint:
      - /bin/sh
      - -c
      - |
        apk add --no-cache sqlite
        if [ ! -s /data/primary/pdns-primary.sqlite3 ]; then
          echo "Initializing PowerDNS primary SQLite database..."
          sqlite3 /data/primary/pdns-primary.sqlite3 < /etc/powerdns/schema.sql
          chmod 666 /data/primary/pdns-primary.sqlite3
        fi
        if [ ! -s /data/secondary/pdns-secondary.sqlite3 ]; then
          echo "Initializing PowerDNS secondary SQLite database..."
          sqlite3 /data/secondary/pdns-secondary.sqlite3 < /etc/powerdns/schema.sql
          chmod 666 /data/secondary/pdns-secondary.sqlite3
        fi
        echo "SQLite initialization completed successfully."

  powerdns-primary:
    image: powerdns/pdns-auth-48:latest
    container_name: example-dns-primary
    restart: unless-stopped
    ports:
      - "53:53/udp"
      - "53:53/tcp"
      - "8081:8081"
    volumes:
      - ./powerdns/primary.conf:/etc/powerdns/pdns.conf:ro
      - ./powerdns/schema.sql:/etc/powerdns/schema.sql:ro
      - primary-data:/var/lib/powerdns
    environment:
      - PDNS_API_KEY=example-dns-secret-api-key
    depends_on:
      init-db:
        condition: service_completed_successfully
    networks:
      - example-dns-net

  powerdns-secondary:
    image: powerdns/pdns-auth-48:latest
    container_name: example-dns-secondary
    restart: unless-stopped
    ports:
      - "5353:53/udp"
      - "5353:53/tcp"
    volumes:
      - ./powerdns/secondary.conf:/etc/powerdns/pdns.conf:ro
      - ./powerdns/schema.sql:/etc/powerdns/schema.sql:ro
      - secondary-data:/var/lib/powerdns
    depends_on:
      init-db:
        condition: service_completed_successfully
      powerdns-primary:
        condition: service_started
    networks:
      - example-dns-net

  web:
    image: php:8.4-cli-alpine
    container_name: example-dns-web
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ../apps/web:/app
    command: ["php", "-S", "0.0.0.0:8080", "-t", "/app"]
    ports:
      - "8080:8080"
    environment:
      - PDNS_API_URL=http://powerdns-primary:8081
      - PDNS_API_KEY=example-dns-secret-api-key
    depends_on:
      - powerdns-primary
    networks:
      - example-dns-net

volumes:
  primary-data:
  secondary-data:

networks:
  example-dns-net:
    driver: bridge
